<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0B0E13" />
<title>발표자 뷰 — PeakBridge</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root{--bg:#0B0E13;--panel:#161B26;--line:#2C3444;--txt:#EAF0F8;--mut:#8C97A9;--grn:#22D39A;--amb:#F5A623}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ── 상단 바 ── */
  #top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(22,27,38,.9),rgba(11,14,19,.9))}
  .brand{font-weight:800;letter-spacing:-.01em;font-size:15px}
  .brand span{color:var(--grn)}
  #timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;letter-spacing:.02em;
    margin-left:6px;min-width:96px}
  #count{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:8px;
    height:34px;padding:0 12px;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--grn);color:var(--grn)}
  .btn.big{font-size:16px;font-weight:700;min-width:44px}

  /* ── 본문 ── */
  #main{flex:1;display:grid;grid-template-columns:1.35fr 1fr;gap:14px;padding:14px 16px;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;gap:10px}
  .lbl{font-size:11px;letter-spacing:.09em;color:var(--grn);text-transform:uppercase;font-weight:700}
  .lbl.next{color:var(--amb)}
  .shot{width:100%;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;
    display:grid;place-items:center}
  .shot img{width:100%;height:100%;object-fit:contain;display:block}
  #curShot{flex:1;min-height:0}
  #nextShot{aspect-ratio:16/9}
  #nextTitle{color:var(--mut);font-size:13px;line-height:1.4;margin-top:2px}

  /* ── 노트(편집 가능) ── */
  #noteWrap{flex:1;display:flex;flex-direction:column;min-height:0}
  #noteHead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  #curTitle{font-size:16px;font-weight:700}
  #editHint{font-size:11px;color:var(--mut)}
  #note{flex:1;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;font-size:20px;line-height:1.7;color:#EAF0F8;outline:none;white-space:pre-wrap}
  #note:focus{border-color:var(--grn)}
  #saveTag{font-size:11px;color:var(--mut);margin-left:auto}
  #saveTag.on{color:var(--grn)}

  @media (max-width:900px){ #main{grid-template-columns:1fr} #curShot{aspect-ratio:16/9;flex:none} }
</style>
</head>
<body>

<div id="top">
  <div class="brand">Peak<span>Bridge</span> 발표자</div>
  <div id="timer">00:00</div>
  <button class="btn" id="timerBtn" title="타이머 시작/정지">▶ 시작</button>
  <button class="btn" id="timerReset" title="타이머 리셋">↺</button>
  <div class="spacer"></div>
  <div id="count">1 / 9</div>
  <button class="btn big" id="prev" title="이전 (←)">←</button>
  <button class="btn big" id="next" title="다음 (→)">→</button>
  <button class="btn" id="export" title="편집한 노트를 notes.json으로 저장">노트 내보내기</button>
  <button class="btn" id="reset" title="편집 초기화">편집 초기화</button>
</div>

<div id="main">
  <!-- 왼쪽: 현재 슬라이드 + 노트 -->
  <div class="col">
    <div class="lbl">현재 슬라이드</div>
    <div class="shot" id="curShot"><img id="curImg" alt="현재" /></div>
  </div>

  <!-- 오른쪽: 다음 슬라이드 미리보기 + 편집 노트 -->
  <div class="col">
    <div class="lbl next">다음 슬라이드</div>
    <div class="shot" id="nextShot"><img id="nextImg" alt="다음" /></div>
    <div id="nextTitle"></div>

    <div id="noteWrap">
      <div id="noteHead">
        <span id="curTitle"></span>
        <span id="editHint">클릭해서 바로 수정 · 자동 저장</span>
        <span id="saveTag">저장됨</span>
      </div>
      <div id="note" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>
</div>

<script>
/* 노트·제목 원본 (index.html과 동일 데이터 내장 — file:// 에서도 동작) */
const DATA = {"notes": {"1": "안녕하십니까, 2026 AI 에너지 스마트홈 메이커톤에 참가한 유니온 AI의 김영광입니다. 저희는 이런 질문에서 시작했습니다 — 어떻게 하면 우리가 가진 기술로 사회 전체에 가장 크고 실질적인 전력 절감 효용을 만들어낼 수 있을까. 가정 내 절전도 중요하지만, 인프라 단위의 시스템 최적화가 이루어질 때 효용이 훨씬 커진다고 생각했습니다. 그래서 시선을 집 안을 넘어 아파트 주차장으로 옮겼습니다.", "2": "저희가 주목한 아파트 전력 환경의 구조적 과제는 세 가지입니다. 첫째, 전기차 충전이 겹치는 퇴근 시간 아파트 변압기는 107% 과부하에 시달리며 막대한 교체 비용을 요구합니다. 둘째, 기껏 설치된 ESS 자원들이 제어 소프트웨어가 없어 잠들어 있습니다. 셋째, 국내 최대의 전력 잠재력을 가진 아파트가 수요관리 시장에서 완전히 소외되어 있습니다. 저희는 이 얽힌 문제를 무리한 설비 교체 대신 소프트웨어로 연결합니다.", "3": "솔루션이 하는 일은 직관적입니다. 입주민에게 불편하게 전기를 아끼라고 강요하지 않습니다. 요금 폭탄을 만드는 저 피크만 정확히 잘라냅니다. 전기요금은 총사용량이 아니라 15분 단위에서 튀어 오른 최고점 하나로 기본요금이 결정됩니다. 피크가 예상되면 충전 출력을 부드럽게 조절하면서 동시에 ESS를 방전시켜 전력 충격을 흡수합니다. 계량기가 인식하는 피크는 깎여나가고 요금은 떨어집니다.", "4": "저희가 선정한 사용자는 CPO의 현장·운영 담당자입니다. 전력시장에서는 수요에 따라 전기의 값이 다릅니다. 같은 1kWh라도 시간대별로 값이 다릅니다. 새벽에는 싼 발전소만 돌려도 충분하지만, 저녁에는 비싼 발전소까지 동원해야 하기 때문입니다.", "5": "여기가 이 사업의 출발점입니다. 피크 시간대의 비싼 전기를 그대로 쓰는 것이 아니라, ESS에 미리 저장해둔 전기를 씁니다. 새벽에 싼 전기를 배터리에 채워두고 저녁에 그 전기를 씁니다. 소프트웨어 시뮬레이션만으로는 실제로 전력이 옮겨간다는 것을 증명할 수 없기 때문에, 물리 회로를 스케일 다운해 계측·판단·절체·복귀 전 과정을 직접 보여드리겠습니다.", "6": "실증 구성입니다. CT 센서로 한전 인입 전류를 실시간 측정하고, XIAO ESP32S3가 임계 판정과 릴레이 구동, MQTT 통신을 담당합니다. 2채널 릴레이가 한전과 인버터 사이를 절체하고, INA219가 배터리 출력 전류와 쿨롱 카운팅 SOC를 계산합니다. BME280이 온도를 감시해 과열 시 강제로 한전에 복귀시킵니다. 배터리는 LiFePO4 4S 12.8V 12Ah입니다. 하드웨어 실증은 스케줄링 알고리즘 기반으로 동작합니다.", "7": "지금까지 보신 하드웨어 실증은 스케줄링 기반입니다. 그런데 단지가 하나에서 열 개, 백 개로 늘어나면 질문이 바뀝니다. 몇 시에 켤까가 아니라, 내일 얼마나 쓸까 그리고 그 부하를 어떻게 나눌까가 됩니다. 여기서부터가 AI의 영역입니다. 첫째, 얼마나 쓸까 — KPX 실측 10년치 9만 시간으로 검증한 XGBoost 수요예측입니다. R² 0.981, 상대오차 1.57%이고, 직전 값을 그대로 쓰는 베이스라인 대비 오차를 73% 줄였습니다. 이 오차가 그대로 콘솔 예측선의 밴드 폭이 됩니다. 둘째, 언제 얼마나 충전할까 — 강화학습 PPO로 500만 스텝 학습했습니다. 충전기가 스무 대, 쉰 대로 늘어나면 누구의 출력을 얼마나 줄일지가 조건문으로 감당되지 않습니다. 그 배분을 학습한 모델이고, PyTorch 없이 NumPy만으로 추론하는 서빙 계층을 직접 구현해 가벼운 클라우드에서도 실시간으로 돕니다.", "8": "저희가 첫 시장으로 제주를 고른 이유를 데이터로 말씀드립니다. 전력거래소 공공데이터 전수 분석입니다. 2021년부터 2023년까지 플러스DR 272건, 90일치. 낙찰률 100% — 입찰한 1,444.5MWh가 전부 낙찰됐습니다. 경쟁자가 없습니다. 이행률 41.7% — 낙찰받고 실제로 더 쓴 것은 602MWh뿐입니다. 기존 참여자가 공장과 건물이라 더 쓰라고 해도 쓸 데가 없기 때문입니다. 배터리는 시키면 100% 합니다. 저희가 파는 것은 전기가 아니라 이행 확실성입니다.", "9": "수익 구조입니다. 실증 6개월 동안 단지가 내는 돈은 0원입니다. 계측기, 소프트웨어, 운영까지 전부 저희가 부담하고 단지는 데이터와 설치 공간만 제공합니다. 아파트 입장에서 예산을 새로 잡을 필요도, 설비를 바꿀 필요도 없습니다. 6개월 이후에는 플러스DR 인센티브와 기본요금 절감이 발생하고, 그것을 단지와 나눕니다. 그다음은 여러 단지를 묶어 집합입찰합니다. 용량이 클수록 시장에서의 자격과 협상력이 올라갑니다. 도입 장벽이 0이면 확산 속도를 결정하는 것은 자본이 아니라 계약입니다. 팀 유니온 AI였습니다. 감사합니다."}, "titles": {"1": "PeakBridge", "2": "왜 지금인가", "3": "아끼라고 하지 않습니다. 피크만 자릅니다", "4": "같은 1kWh라도, 시간에 따라 값이 다릅니다", "5": "싼 시간에 채우고, 비싼 시간에 씁니다", "6": "계측 · 판단 · 절체를 모두 실물로", "7": "AI가 답하는 두 가지 질문", "8": "경쟁이 없는 시장, 그리고 비어 있는 자리", "9": "CPO의 매출 상한을 올려드립니다"}};

const TOTAL = 9;
const $ = (id) => document.getElementById(id);
const titles = DATA.titles || {};

/* 편집된 노트는 localStorage에 저장(원본 위에 덮어씀) — 프로젝터 창과 공유 */
const NOTE_KEY = 'pb_notes';
let store = Object.assign({}, DATA.notes);
try { Object.assign(store, JSON.parse(localStorage.getItem(NOTE_KEY) || '{}')); } catch (e) {}

let idx = 1;

function render() {
  $('curImg').src = `./slides/s${idx}.jpg`;
  const nxt = idx < TOTAL ? idx + 1 : null;
  $('nextImg').src = nxt ? `./slides/s${nxt}.jpg` : '';
  $('nextImg').style.visibility = nxt ? 'visible' : 'hidden';
  $('nextTitle').textContent = nxt ? (titles[nxt] || '') : '— 마지막 슬라이드 —';
  $('count').textContent = `${idx} / ${TOTAL}`;
  $('curTitle').textContent = titles[idx] || '';
  // 편집 중 커서를 방해하지 않도록, 포커스가 노트에 없을 때만 갱신
  if (document.activeElement !== $('note')) $('note').innerText = store[idx] || '';
}

/* ── 두 창 동기화 (BroadcastChannel + localStorage 이벤트, 이중화) ── */
const SYNC_KEY = 'pb_cur';
let bc = null;
try { bc = new BroadcastChannel('pb-deck'); } catch (e) {}
let applyingRemote = false;

function broadcast() {
  if (applyingRemote) return;
  const msg = { idx, t: Date.now() };
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(msg)); } catch (e) {}
  if (bc) { try { bc.postMessage(msg); } catch (e) {} }
}
function applyRemote(n) {
  if (n >= 1 && n <= TOTAL && n !== idx) { applyingRemote = true; idx = n; render(); applyingRemote = false; }
}
if (bc) bc.onmessage = (e) => { if (e.data && e.data.idx) applyRemote(e.data.idx); };
addEventListener('storage', (e) => {
  if (e.key === SYNC_KEY && e.newValue) { try { applyRemote(JSON.parse(e.newValue).idx); } catch (_) {} }
  if (e.key === NOTE_KEY && e.newValue) {  // 다른 창에서 노트가 바뀌면 반영
    try { Object.assign(store, JSON.parse(e.newValue)); if (document.activeElement !== $('note')) render(); } catch (_) {}
  }
});

function go(n) { idx = Math.min(TOTAL, Math.max(1, n)); render(); broadcast(); }

/* ── 노트 편집 → 자동 저장 ── */
let saveTimer = null;
function flagSaving() { $('saveTag').textContent = '저장 중…'; $('saveTag').classList.remove('on'); }
function flagSaved() { $('saveTag').textContent = '저장됨'; $('saveTag').classList.add('on'); }
$('note').addEventListener('input', () => {
  store[idx] = $('note').innerText;
  flagSaving();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(NOTE_KEY, JSON.stringify(store)); } catch (e) {}
    if (bc) { try { bc.postMessage({ noteIdx: idx }); } catch (e) {} }
    flagSaved();
  }, 350);
});

/* ── 내보내기 / 초기화 ── */
$('export').onclick = () => {
  const blob = new Blob([JSON.stringify({ notes: store, titles: DATA.titles }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'notes.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('reset').onclick = () => {
  if (!confirm('편집한 노트를 모두 원본으로 되돌릴까요? (이 창의 저장 내용이 지워집니다)')) return;
  localStorage.removeItem(NOTE_KEY);
  store = Object.assign({}, DATA.notes);
  render();
  flagSaved();
};

/* ── 타이머 ── */
let elapsed = 0, t0 = null, tick = null;
function fmt(s) { const m = Math.floor(s / 60), ss = s % 60; return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0'); }
function paint() { $('timer').textContent = fmt(elapsed + (t0 ? Math.floor((Date.now() - t0) / 1000) : 0)); }
$('timerBtn').onclick = () => {
  if (tick) { clearInterval(tick); tick = null; elapsed += Math.floor((Date.now() - t0) / 1000); t0 = null; $('timerBtn').textContent = '▶ 시작'; }
  else { t0 = Date.now(); tick = setInterval(paint, 250); $('timerBtn').textContent = '⏸ 정지'; }
  paint();
};
$('timerReset').onclick = () => { clearInterval(tick); tick = null; t0 = null; elapsed = 0; $('timerBtn').textContent = '▶ 시작'; paint(); };

/* ── 이동 ── */
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
addEventListener('keydown', (e) => {
  if (e.target.isContentEditable) return;  // 노트 편집 중엔 방향키가 커서 이동
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(idx + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(idx - 1); }
  else if (e.key === 'Home') go(1);
  else if (e.key === 'End') go(TOTAL);
  else if (/^[1-9]$/.test(e.key)) go(+e.key);
});

/* 시작 시 프로젝터 창의 현재 위치를 따라간다 */
try { const cur = JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); if (cur && cur.idx) idx = cur.idx; } catch (e) {}
render();
paint();
</script>
</body>
</html>
